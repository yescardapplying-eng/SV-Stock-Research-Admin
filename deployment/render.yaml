services:
  # 1. NestJS Backend API Web Service
  - type: web
    name: sv-stock-crm-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run prisma:generate && npm run build:api
    startCommand: npm run start:prod --workspace=@sv-crm/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sv-stock-crm-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: sv-stock-crm-db
          property: connectionString
      - key: ADMIN_APP_ORIGIN
        value: https://sv-stock-crm-admin.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: WP_SITE_URL
        value: https://svstockresearch.in
      - key: WP_SITE_IDENTIFIER
        value: sv-stock-research-main
      - key: WP_WEBHOOK_SECRET
        sync: false
      - key: WP_PULL_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info

  # 2. Next.js Admin Frontend Web Service
  - type: web
    name: sv-stock-crm-admin
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:admin
    startCommand: npm run start --workspace=@sv-crm/admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://sv-stock-crm-api.onrender.com

# 3. PostgreSQL Database Instance
databases:
  - name: sv-stock-crm-db
    plan: starter
    databaseName: sv_stock_crm
    user: sv_crm_admin
    postgresMajorVersion: 16
